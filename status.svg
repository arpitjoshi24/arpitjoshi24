<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071230"/>
      <stop offset="1" stop-color="#030816"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" x2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
    <linearGradient id="mp" x1="0" x2="1"><stop offset="0" stop-color="#0066ff"/><stop offset="1" stop-color="#00d9ff"/></linearGradient>
    <linearGradient id="exp" x1="0" x2="1"><stop offset="0" stop-color="#7b2ff7"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
    <linearGradient id="stat" x1="0" x2="1"><stop offset="0" stop-color="#00b4ff"/><stop offset="1" stop-color="#7dffea"/></linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00d9ff" opacity="0.05"/></pattern>
  </defs>

  <rect x="10" y="10" width="880" height="450" rx="10" fill="url(#panel)" stroke="#00b4ff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="10" y="10" width="880" height="450" rx="10" fill="url(#lines)"/>

  <!-- title -->
  <text x="450" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="26" fill="#00f7ff" letter-spacing="14">STATUS</text>
  <line x1="40" y1="68" x2="860" y2="68" stroke="#00b4ff" stroke-opacity="0.6"/>

  <!-- identity -->
  <g font-family="'Courier New', monospace" font-size="16">
    <text x="50" y="100" fill="#5fb8d6">NAME</text><text x="170" y="100" fill="#ffffff">: Arpit Joshi</text>
    <text x="50" y="124" fill="#5fb8d6">JOB</text><text x="170" y="124" fill="#ffffff">: Full Stack Developer</text>
    <text x="50" y="148" fill="#5fb8d6">GUILD</text><text x="170" y="148" fill="#ffffff">: Graphic Era Hill University</text>
    <text x="520" y="100" fill="#5fb8d6">LEVEL</text><text x="610" y="100" fill="#ffffff">: B.Tech CSE '27</text>
    <text x="520" y="124" fill="#5fb8d6">TITLE</text><text x="610" y="124" fill="#ffd34d">: The Builder</text>
    <text x="520" y="148" fill="#5fb8d6">QUEST</text><text x="610" y="148" fill="#7dffea">: Backend + Next.js</text>
  </g>
  <line x1="40" y1="166" x2="860" y2="166" stroke="#00b4ff" stroke-opacity="0.3"/>

  <!-- bars: label x=50, track x=190 w=500, value x=710 -->
  <g font-family="'Courier New', monospace" font-size="16">

    <!-- HP -->
    <text x="50" y="203" fill="#ff6b81" font-weight="bold">HP</text>
    <rect x="190" y="189" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="189" width="0" height="16" rx="3" fill="url(#hp)"><animate attributeName="width" values="0;460;460;0" keyTimes="0;0.18;0.9;1" dur="9s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="710" y="203" fill="#ffb3bd">92%  Caffeine-fueled</text>

    <!-- MP -->
    <text x="50" y="235" fill="#6fd0ff" font-weight="bold">MP</text>
    <rect x="190" y="221" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="221" width="0" height="16" rx="3" fill="url(#mp)"><animate attributeName="width" values="0;440;440;0" keyTimes="0;0.18;0.9;1" dur="9s" begin="0.2s" repeatCount="indefinite"/></rect>
    <text x="710" y="235" fill="#b3e8ff">88%  Ideas: endless</text>

    <!-- EXP -->
    <text x="50" y="267" fill="#c58bff" font-weight="bold">EXP</text>
    <rect x="190" y="253" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="253" width="0" height="16" rx="3" fill="url(#exp)"><animate attributeName="width" values="0;355;355;0" keyTimes="0;0.18;0.9;1" dur="9s" begin="0.4s" repeatCount="indefinite"/></rect>
    <text x="710" y="267" fill="#e0c4ff">71%  Leveling daily</text>
  </g>

  <line x1="40" y1="288" x2="860" y2="288" stroke="#00b4ff" stroke-opacity="0.3"/>

  <g font-family="'Courier New', monospace" font-size="16">
    <!-- STR -->
    <text x="50" y="324" fill="#7dffea" font-weight="bold">STR</text>
    <text x="108" y="324" fill="#5fb8d6" font-size="12">backend</text>
    <rect x="190" y="310" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="310" width="0" height="16" rx="3" fill="url(#stat)"><animate attributeName="width" values="0;340;340;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="710" y="324" fill="#ffffff">68</text>

    <!-- AGI -->
    <text x="50" y="354" fill="#7dffea" font-weight="bold">AGI</text>
    <text x="108" y="354" fill="#5fb8d6" font-size="12">frontend</text>
    <rect x="190" y="340" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="340" width="0" height="16" rx="3" fill="url(#stat)"><animate attributeName="width" values="0;470;470;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="0.8s" repeatCount="indefinite"/></rect>
    <text x="710" y="354" fill="#ffffff">94</text>

    <!-- INT -->
    <text x="50" y="384" fill="#7dffea" font-weight="bold">INT</text>
    <text x="108" y="384" fill="#5fb8d6" font-size="12">problem solving</text>
    <rect x="190" y="370" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="370" width="0" height="16" rx="3" fill="url(#stat)"><animate attributeName="width" values="0;430;430;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="1s" repeatCount="indefinite"/></rect>
    <text x="710" y="384" fill="#ffffff">86</text>

    <!-- VIT -->
    <text x="50" y="414" fill="#7dffea" font-weight="bold">VIT</text>
    <text x="108" y="414" fill="#5fb8d6" font-size="12">consistency</text>
    <rect x="190" y="400" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="400" width="0" height="16" rx="3" fill="url(#stat)"><animate attributeName="width" values="0;370;370;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="1.2s" repeatCount="indefinite"/></rect>
    <text x="710" y="414" fill="#ffffff">74</text>

    <!-- SENSE -->
    <text x="50" y="444" fill="#7dffea" font-weight="bold">SENSE</text>
    <text x="126" y="444" fill="#5fb8d6" font-size="12">UI taste</text>
    <rect x="190" y="430" width="500" height="16" rx="3" fill="#0d1a38"/>
    <rect x="190" y="430" width="0" height="16" rx="3" fill="url(#stat)"><animate attributeName="width" values="0;450;450;0" keyTimes="0;0.2;0.9;1" dur="9s" begin="1.4s" repeatCount="indefinite"/></rect>
    <text x="710" y="444" fill="#ffffff">90</text>
  </g>

  <text x="850" y="444" text-anchor="end" font-family="'Courier New', monospace" font-size="13" fill="#ffd34d">
    +∞ STAT POINTS
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>
